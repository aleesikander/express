name: Garnet Express Baseline

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  express-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Start Garnet Runtime Review
        uses: garnet-org/action@3d47f4a9004f7356c980a0e8d420ef5984750e3c # v2.2.0
        with:
          api_token: ${{ secrets.GARNET_API_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --ignore-scripts --include=dev

      - name: Run lint
        run: npm run lint

      - name: Run targeted Express tests
        run: |
          ./node_modules/.bin/mocha \
            --require test/support/env \
            --reporter spec \
            --check-leaks \
            test/acceptance/hello-world.js \
            test/app.listen.js

      - name: Controlled long-lived Node HTTPS request
        shell: bash
        run: |
          node <<'NODE'
          const https = require('node:https');

          const agent = new https.Agent({
            keepAlive: true,
            keepAliveMsecs: 30000,
            maxSockets: 1,
            maxFreeSockets: 1
          });

          let socketReference;
          let holdTimer;
          let safetyTimer;
          let finished = false;

          function finish(exitCode = 0) {
            if (finished) {
              return;
            }

            finished = true;
            clearTimeout(holdTimer);
            clearTimeout(safetyTimer);
            agent.destroy();
            process.exitCode = exitCode;
          }

          safetyTimer = setTimeout(() => {
            console.error('Diagnostic safety timeout reached');
            finish(1);
          }, 30000);

          const request = https.get(
            'https://example.com/?garnet-evaluation=express-direct',
            {
              agent,
              headers: {
                'User-Agent': 'garnet-express-evaluation/1.0',
                Connection: 'keep-alive'
              }
            },
            (response) => {
              response.resume();

              response.on('end', () => {
                console.log(
                  `Controlled request completed with status ${response.statusCode}`
                );

                if (
                  response.statusCode === undefined ||
                  response.statusCode < 200 ||
                  response.statusCode >= 400
                ) {
                  finish(1);
                  return;
                }

                if (socketReference) {
                  console.log(
                    `Connected socket: ${socketReference.remoteAddress}:${socketReference.remotePort} ` +
                    `family=${socketReference.remoteFamily} destroyed=${socketReference.destroyed}`
                  );
                }

                console.log(
                  'Holding the HTTPS keep-alive agent for 15 seconds for capture diagnostics'
                );

                holdTimer = setTimeout(() => {
                  if (socketReference) {
                    console.log(
                      `Socket after hold: destroyed=${socketReference.destroyed}`
                    );
                  }

                  console.log('Diagnostic hold completed');
                  finish(0);
                }, 15000);
              });
            }
          );

          request.on('socket', (socket) => {
            socketReference = socket;

            socket.once('secureConnect', () => {
              console.log(
                `TLS connection established to ${socket.remoteAddress}:${socket.remotePort} ` +
                `family=${socket.remoteFamily}`
              );
            });
          });

          request.setTimeout(10000, () => {
            request.destroy(new Error('Controlled request timed out'));
          });

          request.on('error', (error) => {
            console.error(`Controlled request failed: ${error.message}`);
            finish(1);
          });
          NODE
