name: ci

on:
  push:
    branches:
      - master
      - develop
      - '4.x'
      - '5.x'
      - '5.0'
    paths-ignore:
      - '*.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel in progress workflows
# in the scenario where we already had a run going for that PR/branch/tag but then triggered a new run
concurrency:
  group: "${{ github.workflow }} ✨ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm install --ignore-scripts --include=dev

      - name: Run lint
        run: npm run lint

  test:
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [18, 19, 20, 21, 22, 23, 24, 25, 26]
        # Node.js release schedule: https://nodejs.org/en/about/releases/

    name: Node.js ${{ matrix.node-version }} - ${{matrix.os}}

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Start Garnet Runtime Review
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 24
        uses: garnet-org/action@3d47f4a9004f7356c980a0e8d420ef5984750e3c # v2.2.0
        with:
          api_token: ${{ secrets.GARNET_API_TOKEN }}

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Configure npm loglevel
        run: |
          npm config set loglevel error
        shell: bash

      - name: Install dependencies
        run: npm install

      - name: Output Node and NPM versions
        run: |
          echo "Node.js version: $(node -v)"
          echo "NPM version: $(npm -v)"

      - name: Run tests
        env:
          RUN_NODE_HTTPS_CONTROL: ${{ matrix.os == 'ubuntu-latest' && matrix.node-version == 24 && 'true' || 'false' }}
        shell: bash
        run: |
          set -e

          if [[ "$RUN_NODE_HTTPS_CONTROL" == "true" ]]; then
            node <<'NODE'
          'use strict'

          var https = require('node:https')

          var maximumBodySize = 1024 * 1024
          var timeout = 10000
          var options = {
            hostname: 'api.github.com',
            port: 443,
            path: '/repos/expressjs/express',
            method: 'GET',
            headers: {
              Accept: 'application/vnd.github+json',
              'User-Agent': 'express-run-tests-direct-node-control',
              'X-GitHub-Api-Version': '2022-11-28'
            },
            rejectUnauthorized: true,
            timeout: timeout
          }

          function requireValue(condition, message) {
            if (!condition) throw new Error(message)
          }

          new Promise(function (resolve, reject) {
            var settled = false
            var deadline
            var transport

            function fail(error) {
              if (settled) return
              settled = true
              clearTimeout(deadline)
              reject(error)
            }

            function succeed(value) {
              if (settled) return
              settled = true
              clearTimeout(deadline)
              resolve(value)
            }

            var request = https.request(options, function (response) {
              var chunks = []
              var bodySize = 0

              response.on('data', function (chunk) {
                bodySize += chunk.length
                if (bodySize > maximumBodySize) {
                  var error = new Error('response body exceeded 1 MiB')
                  response.destroy(error)
                  request.destroy(error)
                  fail(error)
                  return
                }
                chunks.push(chunk)
              })

              response.once('aborted', function () {
                fail(new Error('response was aborted'))
              })
              response.once('error', fail)
              response.once('end', function () {
                if (settled) return
                try {
                  requireValue(response.complete, 'response did not complete')
                  requireValue(response.statusCode === 200,
                    'unexpected HTTP status: ' + response.statusCode)
                  var contentType = String(response.headers['content-type'] || '')
                  requireValue(/^application\/json\b/i.test(contentType),
                    'response content type was not JSON: ' + contentType)
                  var data = JSON.parse(Buffer.concat(chunks).toString('utf8'))
                  requireValue(data.full_name === 'expressjs/express',
                    'unexpected repository full_name')
                  requireValue(data.name === 'express',
                    'unexpected repository name')
                  requireValue(data.owner && data.owner.login === 'expressjs',
                    'unexpected repository owner')
                  requireValue(data.private === false,
                    'repository was not public')
                  requireValue(
                    data.html_url === 'https://github.com/expressjs/express',
                    'unexpected repository URL')
                  requireValue(transport,
                    'TLS transport evidence was unavailable')
                  requireValue(transport.remoteAddress,
                    'remote address was unavailable')
                  requireValue(transport.remotePort,
                    'remote port was unavailable')
                  requireValue(transport.authorized === true,
                    'TLS connection was not authorized')
                  var requestId = response.headers['x-github-request-id']
                  requireValue(
                    typeof requestId === 'string' && requestId.length > 0,
                    'GitHub request ID was unavailable')
                  succeed({
                    data: data,
                    requestId: requestId,
                    status: response.statusCode,
                    transport: transport
                  })
                } catch (error) {
                  fail(error)
                }
              })
            })

            request.once('socket', function (socket) {
              socket.once('secureConnect', function () {
                var certificate = socket.getPeerCertificate()
                transport = {
                  remoteAddress: socket.remoteAddress,
                  remotePort: socket.remotePort,
                  authorized: socket.authorized,
                  certificateCommonName: certificate && certificate.subject
                    ? certificate.subject.CN
                    : undefined,
                  certificateSubjectAltName: certificate
                    ? certificate.subjectaltname
                    : undefined
                }
              })
            })
            request.once('timeout', function () {
              request.destroy(new Error('request timed out'))
            })
            request.once('error', fail)
            deadline = setTimeout(function () {
              var error = new Error('request exceeded 10-second deadline')
              request.destroy(error)
              fail(error)
            }, timeout)
            request.end()
          }).then(function (result) {
            console.log('[run-tests-direct-node-transport] remote_address=%s remote_port=%s tls_authorized=%s cert_cn=%s cert_san=%s',
              result.transport.remoteAddress, result.transport.remotePort,
              result.transport.authorized,
              result.transport.certificateCommonName,
              result.transport.certificateSubjectAltName)
            console.log('[run-tests-direct-node-metadata] host=%s status=%d full_name=%s github_request_id=%s',
              options.hostname, result.status, result.data.full_name,
              result.requestId)
          }).catch(function (error) {
            console.error('[run-tests-direct-node-control] ' + error.message)
            process.exitCode = 1
          })
          NODE
          fi

          npm run test-ci

      - name: Upload code coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-node-${{ matrix.node-version }}-${{ matrix.os }}
          path: ./coverage/lcov.info
          retention-days: 1

  coverage:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install lcov
        shell: bash
        run: sudo apt-get -y install lcov

      - name: Collect coverage reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ./coverage
          pattern: coverage-node-*

      - name: Merge coverage reports
        shell: bash
        run: find ./coverage -name lcov.info -exec printf '-a %q\n' {} \; | xargs lcov -o ./lcov.info

      - name: Upload coverage report
        uses: coverallsapp/github-action@5cbfd81b66ca5d10c19b062c04de0199c215fb6e # v2.3.7
        with:
          file: ./lcov.info
